synthetic_sensor:
  ros__parameters:
    # Shared motion parameters
    amplitudes: [1.0, 0.3, 0.1]
    frequencies: [0.5, 1.5, 3.0]
    phases: [0.0, 0.0, 0.0]
    wheel_circumference: 0.203
    counts_per_revolution: 4096
    seed: 42  # Random seed for repeatable data generation

    # IMU settings (high rate for benchmarking)
    imu:
      rate: 2000.0
      noise_std: 0.00
      drop_rate: 0.000
      jitter_range: 0.0

    # Encoder settings (low rate for benchmarking)
    encoder:
      rate: 0.0
      drop_rate: 0.00
      jitter_range: 0.00
